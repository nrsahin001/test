<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OIDC Browser Test</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      max-width: 820px;
      margin: 40px auto;
      padding: 0 16px;
      line-height: 1.5;
      color: #18181b;
    }
    .card {
      border: 1px solid #e4e4e7;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 18px;
      background: #fafafa;
    }
    label { display: block; font-size: 13px; font-weight: 600; margin-top: 10px; }
    input {
      width: 100%;
      padding: 8px 10px;
      margin-top: 4px;
      border: 1px solid #d4d4d8;
      border-radius: 6px;
      font-family: monospace;
      font-size: 13px;
    }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
    button {
      padding: 9px 14px;
      border: 1px solid #27272a;
      border-radius: 6px;
      background: #18181b;
      color: #fff;
      font-size: 14px;
      cursor: pointer;
    }
    button.secondary { background: #fff; color: #18181b; }
    pre {
      background: #111827;
      color: #f9fafb;
      padding: 14px;
      border-radius: 8px;
      overflow-x: auto;
      font-size: 12.5px;
    }
    .ok { color: #15803d; font-weight: 600; }
    .err { color: #b91c1c; font-weight: 600; }
    code { background: #f4f4f5; padding: 2px 5px; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>OIDC Public Client Test (PKCE)</h1>
  <p>Tests discovery, authorization redirect, PKCE token exchange, and ID token claims directly in the browser[cite: 2, 4].</p>

  <div class="card">
    <label for="issuer">Issuer URL</label>
    <input id="issuer" value="https://app.najibur.me" />

    <label for="clientId">Client ID</label>
    <input id="clientId" value="q5EgxX6PElpq2awgXRlLcIDgynacQHpx" />

    <label for="redirectUri">Redirect URI (must match registered URI exactly)</label>
    <input id="redirectUri" />

    <label for="scope">Scopes</label>
    <input id="scope" value="openid profile email phone birthdate" />

    <div class="actions">
      <button id="loginBtn" type="button">Sign In with OIDC</button>
      <button id="discoverBtn" class="secondary" type="button">Check Discovery</button>
      <button id="clearBtn" class="secondary" type="button">Clear Output</button>
    </div>
  </div>

  <p id="status"></p>

  <h3>Decoded ID Token Claims</h3>
  <pre id="claims">None</pre>

  <h3>Raw Response / Metadata</h3>
  <pre id="raw">None</pre>

  <script>
    const issuerEl = document.getElementById('issuer');
    const clientIdEl = document.getElementById('clientId');
    const redirectUriEl = document.getElementById('redirectUri');
    const scopeEl = document.getElementById('scope');
    const statusEl = document.getElementById('status');
    const claimsEl = document.getElementById('claims');
    const rawEl = document.getElementById('raw');

    const defaultRedirect = window.location.origin + window.location.pathname;
    redirectUriEl.value = defaultRedirect;

    const STORAGE_KEY = 'oidc_pkce_test_state';

    function setStatus(msg, type = '') {
      statusEl.className = type;
      statusEl.textContent = msg;
    }

    function b64u(bytes) {
      const arr = bytes instanceof Uint8Array ? bytes : new Uint8Array(bytes);
      let bin = '';
      for (let i = 0; i < arr.length; i++) bin += String.fromCharCode(arr[i]);
      return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }

    function randomToken(len = 32) {
      return b64u(crypto.getRandomValues(new Uint8Array(len)));
    }

    async function sha256B64u(plain) {
      const digest = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(plain));
      return b64u(digest);
    }

    function decodeJwt(token) {
      const parts = String(token).split('.');
      if (parts.length !== 3) throw new Error('Invalid JWT structure');
      const json = atob(parts[1].replace(/-/g, '+').replace(/_/g, '/'));
      return JSON.parse(json);
    }

    function getConfig() {
      return {
        issuer: issuerEl.value.trim().replace(/\/+$/, ''),
        clientId: clientIdEl.value.trim(),
        redirectUri: redirectUriEl.value.trim(),
        scope: scopeEl.value.trim()
      };
    }

    async function fetchDiscovery(issuer) {
      const res = await fetch(`${issuer}/.well-known/openid-configuration`);
      if (!res.ok) throw new Error(`Discovery HTTP ${res.status}`);
      return res.json();
    }

    document.getElementById('discoverBtn').addEventListener('click', async () => {
      try {
        setStatus('Fetching discovery document...');
        const { issuer } = getConfig();
        const meta = await fetchDiscovery(issuer);
        rawEl.textContent = JSON.stringify(meta, null, 2);
        setStatus('Discovery document loaded successfully.', 'ok');
      } catch (err) {
        setStatus(`Discovery error: ${err.message}`, 'err');
      }
    });

    document.getElementById('loginBtn').addEventListener('click', async () => {
      try {
        const cfg = getConfig();
        if (!cfg.issuer || !cfg.clientId || !cfg.redirectUri) {
          throw new Error('Issuer, Client ID, and Redirect URI are required.');
        }

        setStatus('Preparing PKCE authorization request...');
        const meta = await fetchDiscovery(cfg.issuer);
        if (!meta.authorization_endpoint) {
          throw new Error('authorization_endpoint missing in discovery metadata.');
        }

        const state = randomToken(18);
        const nonce = randomToken(18);
        const verifier = randomToken(48);
        const challenge = await sha256B64u(verifier);

        sessionStorage.setItem(STORAGE_KEY, JSON.stringify({
          state,
          nonce,
          verifier,
          cfg
        }));

        const authUrl = new URL(meta.authorization_endpoint);
        authUrl.search = new URLSearchParams({
          response_type: 'code',
          client_id: cfg.clientId,
          redirect_uri: cfg.redirectUri,
          scope: cfg.scope,
          state,
          nonce,
          code_challenge: challenge,
          code_challenge_method: 'S256'
        }).toString();

        window.location.assign(authUrl.toString());
      } catch (err) {
        setStatus(`Start login error: ${err.message}`, 'err');
      }
    });

    document.getElementById('clearBtn').addEventListener('click', () => {
      sessionStorage.removeItem(STORAGE_KEY);
      claimsEl.textContent = 'None';
      rawEl.textContent = 'None';
      setStatus('');
      window.history.replaceState({}, '', window.location.pathname);
    });

    (async function handleCallback() {
      const params = new URLSearchParams(window.location.search);
      const code = params.get('code');
      const error = params.get('error');
      if (!code && !error) return;

      const savedRaw = sessionStorage.getItem(STORAGE_KEY);
      sessionStorage.removeItem(STORAGE_KEY);
      const saved = savedRaw ? JSON.parse(savedRaw) : null;

      if (saved?.cfg) {
        issuerEl.value = saved.cfg.issuer;
        clientIdEl.value = saved.cfg.clientId;
        redirectUriEl.value = saved.cfg.redirectUri;
        scopeEl.value = saved.cfg.scope;
      }

      if (error) {
        setStatus(`Authorization error: ${error} — ${params.get('error_description') || ''}`, 'err');
        return;
      }

      if (!saved || params.get('state') !== saved.state) {
        setStatus('State mismatch or missing session state.', 'err');
        return;
      }

      try {
        setStatus('Exchanging authorization code at token endpoint...');
        const meta = await fetchDiscovery(saved.cfg.issuer);
        if (!meta.token_endpoint) {
          throw new Error('token_endpoint missing in discovery metadata.');
        }

        const tokenRes = await fetch(meta.token_endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: new URLSearchParams({
            grant_type: 'authorization_code',
            client_id: saved.cfg.clientId,
            code,
            redirect_uri: saved.cfg.redirectUri,
            code_verifier: saved.verifier
          })
        });

        const tokenJson = await tokenRes.json().catch(() => ({}));
        rawEl.textContent = JSON.stringify(tokenJson, null, 2);

        if (!tokenRes.ok) {
          throw new Error(`Token endpoint returned ${tokenRes.status}: ${tokenJson.error_description || tokenJson.error || 'Unknown error'}`);
        }

        if (tokenJson.id_token) {
          const claims = decodeJwt(tokenJson.id_token);
          if (saved.nonce && claims.nonce && claims.nonce !== saved.nonce) {
            throw new Error('ID token nonce mismatch.');
          }
          claimsEl.textContent = JSON.stringify(claims, null, 2);
        }

        setStatus('OIDC login flow succeeded!', 'ok');
        window.history.replaceState({}, '', saved.cfg.redirectUri);
      } catch (err) {
        setStatus(`Callback error: ${err.message}`, 'err');
      }
    })();
  </script>
</body>
</html>
