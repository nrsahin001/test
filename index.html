<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — Together</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --border: #334155;
      --error-bg: rgba(239, 68, 68, 0.15);
      --error-border: rgba(239, 68, 68, 0.45);
      --error-text: #fca5a5;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.25rem;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.75rem;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
    }
    h1 {
      margin: 0 0 0.4rem;
      font-size: 1.45rem;
      letter-spacing: -0.01em;
    }
    .subtitle {
      margin: 0 0 1.25rem;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.45;
    }
    .error {
      margin: 0 0 1rem;
      padding: 0.75rem 0.9rem;
      border-radius: 8px;
      background: var(--error-bg);
      border: 1px solid var(--error-border);
      color: var(--error-text);
      font-size: 0.88rem;
      line-height: 1.4;
    }
    .btn {
      display: block;
      width: 100%;
      text-align: center;
      text-decoration: none;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      font-size: 0.98rem;
      padding: 0.8rem 1rem;
      border-radius: 9px;
      border: 0;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .btn:hover { background: var(--accent-hover); }
    .btn-secondary {
      margin-top: 0.65rem;
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
      font-size: 0.85rem;
      padding: 0.55rem 0.85rem;
    }
    .btn-secondary:hover {
      color: var(--text);
      border-color: #475569;
      background: rgba(255, 255, 255, 0.03);
    }
    .small {
      margin: 0.9rem 0 0;
      font-size: 0.84rem;
      color: var(--muted);
      text-align: center;
    }
    .small a { color: #93c5fd; }
    details {
      margin-top: 1rem;
      border-top: 1px solid var(--border);
      padding-top: 0.75rem;
      font-size: 0.8rem;
      color: var(--muted);
    }
    pre {
      margin: 0.5rem 0 0;
      padding: 0.65rem;
      border-radius: 8px;
      background: #0b1120;
      color: #cbd5e1;
      overflow-x: auto;
      max-height: 220px;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Together</h1>
    <p class="subtitle">Sign in with {{PROVIDER}} to continue.</p>

    {{ERROR}}

    <a class="btn" href="/auth/start">Continue with {{PROVIDER}}</a>

    {{SIGNUP}}

    <details id="diagBox">
      <summary style="cursor:pointer;">OIDC Provider Check</summary>
      <button type="button" class="btn btn-secondary" id="checkBtn">Check Discovery Endpoint</button>
      <pre id="diagOut">Click "Check Discovery Endpoint" to test reachability.</pre>
    </details>
  </main>

  <script>
    const checkBtn = document.getElementById('checkBtn');
    const diagOut = document.getElementById('diagOut');
    const diagBox = document.getElementById('diagBox');

    checkBtn.addEventListener('click', async () => {
      diagBox.open = true;
      diagOut.textContent = 'Checking https://app.najibur.me/.well-known/openid-configuration ...';
      try {
        const res = await fetch('https://app.najibur.me/.well-known/openid-configuration', { cache: 'no-store' });
        const text = await res.text();
        let formatted = text;
        try { formatted = JSON.stringify(JSON.parse(text), null, 2); } catch {}
        diagOut.textContent = `HTTP ${res.status} ${res.statusText}\n\n${formatted}`;
      } catch (err) {
        diagOut.textContent =
          `Browser fetch failed: ${err.message}\n` +
          'Note: If your server sign-in button works, the issue is only missing CORS headers on /.well-known/openid-configuration for browser requests.';
      }
    });
  </script>
</body>
</html>
