<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OIDC Confidential App Test (app2)</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      max-width: 820px;
      margin: 40px auto;
      padding: 0 16px;
      line-height: 1.5;
      color: #18181b;
    }
    .card {
      border: 1px solid #e4e4e7;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 18px;
      background: #fafafa;
    }
    .meta p { margin: 6px 0; font-size: 14px; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
    button {
      padding: 9px 14px;
      border: 1px solid #27272a;
      border-radius: 6px;
      background: #18181b;
      color: #fff;
      font-size: 14px;
      cursor: pointer;
    }
    button.secondary { background: #fff; color: #18181b; }
    pre {
      background: #111827;
      color: #f9fafb;
      padding: 14px;
      border-radius: 8px;
      overflow-x: auto;
      font-size: 12.5px;
    }
    .ok { color: #15803d; font-weight: 600; }
    .err { color: #b91c1c; font-weight: 600; }
    code { background: #f4f4f5; padding: 2px 5px; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>OIDC Confidential Client Tester (<code>app2</code>)</h1>

  <div class="card meta">
    <p><strong>Issuer:</strong> <code>https://app.najibur.me</code></p>
    <p><strong>Client ID:</strong> <code>q5EgxX6PElpq2awgXRlLcIDgynacQHpx</code></p>
    <p><strong>Client Secret:</strong> <em>Stored on server (not exposed in HTML)</em></p>
    <p><strong>Scopes:</strong> <code>openid profile email phone birthdate</code></p>
    <div class="actions">
      <button id="loginBtn" type="button">Start OIDC Login</button>
      <button id="resetBtn" class="secondary" type="button">Reset</button>
    </div>
  </div>

  <p id="status"></p>

  <h3>Decoded ID Token Claims</h3>
  <pre id="claims">Not signed in yet.</pre>

  <h3>Raw Token Response</h3>
  <pre id="raw">None</pre>

  <script>
    const ISSUER = 'https://app.najibur.me';
    const CLIENT_ID = 'q5EgxX6PElpq2awgXRlLcIDgynacQHpx';
    const REDIRECT_URI = window.location.origin + '/';
    const SCOPE = 'openid profile email phone birthdate';
    const STORAGE_KEY = 'Q0rDS3b1nDtdXaiQT8MBcmTM1sIQRC8scia2aQhC0FihnX-9F3wccw';

    const statusEl = document.getElementById('status');
    const claimsEl = document.getElementById('claims');
    const rawEl = document.getElementById('raw');

    function setStatus(msg, type = '') {
      statusEl.className = type;
      statusEl.textContent = msg;
    }

    function b64u(bytes) {
      const arr = bytes instanceof Uint8Array ? bytes : new Uint8Array(bytes);
      let bin = '';
      for (let i = 0; i < arr.length; i++) bin += String.fromCharCode(arr[i]);
      return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }

    function randomToken(len = 32) {
      return b64u(crypto.getRandomValues(new Uint8Array(len)));
    }

    async function sha256B64u(plain) {
      const digest = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(plain));
      return b64u(digest);
    }

    function decodeJwt(token) {
      const parts = String(token).split('.');
      if (parts.length !== 3) throw new Error('Invalid ID token format');
      return JSON.parse(atob(parts[1].replace(/-/g, '+').replace(/_/g, '/')));
    }

    document.getElementById('loginBtn').addEventListener('click', async () => {
      try {
        setStatus('Loading OIDC discovery metadata...');
        const discRes = await fetch(`${ISSUER}/.well-known/openid-configuration`);
        if (!discRes.ok) throw new Error(`Discovery failed (${discRes.status})`);
        const meta = await discRes.json();

        const state = randomToken(18);
        const nonce = randomToken(18);
        const verifier = randomToken(48);
        const challenge = await sha256B64u(verifier);

        sessionStorage.setItem(STORAGE_KEY, JSON.stringify({ state, nonce, verifier }));

        const authUrl = new URL(meta.authorization_endpoint);
        authUrl.search = new URLSearchParams({
          response_type: 'code',
          client_id: CLIENT_ID,
          redirect_uri: REDIRECT_URI,
          scope: SCOPE,
          state,
          nonce,
          code_challenge: challenge,
          code_challenge_method: 'S256'
        }).toString();

        window.location.assign(authUrl.toString());
      } catch (err) {
        setStatus(err.message, 'err');
      }
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      sessionStorage.removeItem(STORAGE_KEY);
      claimsEl.textContent = 'Not signed in yet.';
      rawEl.textContent = 'None';
      setStatus('');
      window.history.replaceState({}, '', REDIRECT_URI);
    });

    (async function handleCallback() {
      const params = new URLSearchParams(window.location.search);
      const code = params.get('code');
      const error = params.get('error');
      if (!code && !error) return;

      const saved = JSON.parse(sessionStorage.getItem(STORAGE_KEY) || 'null');
      sessionStorage.removeItem(STORAGE_KEY);

      if (error) {
        setStatus(`Authorization error: ${error} (${params.get('error_description') || ''})`, 'err');
        return;
      }

      if (!saved || params.get('state') !== saved.state) {
        setStatus('State mismatch or missing PKCE session data.', 'err');
        return;
      }

      try {
        setStatus('Exchanging code via backend using client_secret...');
        // Your backend endpoint exchanges { code, code_verifier, redirect_uri } using Basic Auth (client_id + client_secret)
        const res = await fetch('/api/token-exchange', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            code,
            code_verifier: saved.verifier,
            redirect_uri: REDIRECT_URI
          })
        });

        const data = await res.json();
        rawEl.textContent = JSON.stringify(data, null, 2);

        if (!res.ok || !data.id_token) {
          throw new Error(data.error_description || data.error || `Token exchange failed (${res.status})`);
        }

        const claims = decodeJwt(data.id_token);
        if (claims.nonce && claims.nonce !== saved.nonce) {
          throw new Error('ID token nonce mismatch.');
        }

        claimsEl.textContent = JSON.stringify(claims, null, 2);
        setStatus('Confidential OIDC login succeeded!', 'ok');
        window.history.replaceState({}, '', REDIRECT_URI);
      } catch (err) {
        setStatus(err.message, 'err');
      }
    })();
  </script>
</body>
</html>
